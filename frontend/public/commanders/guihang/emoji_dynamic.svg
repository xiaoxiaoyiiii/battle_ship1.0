<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    
    <style>
      @keyframes ringTurn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .dyn-ring { transform-origin: 80px 80px; animation: ringTurn 7s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .dyn-ring { animation: none !important; } }
    </style>
    <clipPath id="emClip"><rect x="4" y="4" width="152" height="152" rx="24"/></clipPath>
    <linearGradient id="emGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191f2c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#191f2c" stop-opacity="0.86"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="26" fill="#191f2c"/>
  <g clip-path="url(#emClip)">
    <image x="0" y="0" width="160" height="160" preserveAspectRatio="xMidYMid slice" href="data:image/webp;base64,"/>
    <rect x="0" y="96" width="160" height="64" fill="url(#emGrad)"/>
    <rect class="dyn-ring" x="12" y="12" width="136" height="136" rx="22" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="10 6" stroke-opacity="0.8"/>
  </g>
  <rect x="4" y="4" width="152" height="152" rx="24" fill="none" stroke="#eab354" stroke-width="3"/>
  <rect x="16" y="124" width="128" height="24" rx="12" fill="#191f2c" fill-opacity="0.92" stroke="#fef08a" stroke-width="1.6"/>
  <text x="80" y="140.5" text-anchor="middle" font-family="'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#fef08a">星辉算筹</text>
</svg>
