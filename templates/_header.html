<div class="nav">
    {% if username %}
        <span>已登录: {{ username }}</span> | <a href="/logout">退出</a> | <a href="/lobby">大厅</a> | <a href="/leaderboard">排行榜</a>
    {% else %}
        <a href="/login">登录</a> | <a href="/register">注册</a> | <a href="/leaderboard">排行榜</a>
    {% endif %}
    <button id="theme-toggle" class="btn secondary" style="margin-left:12px;">切换主题</button>
</div>

<script>
(function(){
    function applyTheme(){
        const t = localStorage.getItem('battleship_theme');
        if(t === 'dark') document.documentElement.classList.add('theme-dark'); else document.documentElement.classList.remove('theme-dark');
        const btn = document.getElementById('theme-toggle');
        if(btn) btn.textContent = (t === 'dark') ? '浅色主题' : '深色主题';
    }
    document.addEventListener('DOMContentLoaded', applyTheme);
    document.addEventListener('click', function(e){
        if(e.target && e.target.id === 'theme-toggle'){
            const cur = localStorage.getItem('battleship_theme');
            localStorage.setItem('battleship_theme', cur === 'dark' ? 'light' : 'dark');
            applyTheme();
        }
    });
})();
</script>
