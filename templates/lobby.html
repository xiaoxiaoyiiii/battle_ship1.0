<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>大厅</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  </head>
  <body>
    <div class="game-container">
      {% include '_header.html' %}
      <h2>房间大厅</h2>
      <p>点击加入匹配队列，找到对手后会自动为你创建房间并跳转。</p>

      <div id="lobby-controls">
        <button class="btn" id="join-lobby">加入匹配</button>
        <button class="btn secondary" id="leave-lobby" style="display:none;">离开匹配</button>
        <div id="lobby-status">未加入</div>
      </div>

      <div id="available-players">
        <h3>等待匹配的玩家</h3>
        <ul id="players-list"></ul>
      </div>

      <p><a href="/">返回游戏</a></p>
    </div>

    <script>
      const socket = io();
      const joinBtn = document.getElementById('join-lobby');
      const leaveBtn = document.getElementById('leave-lobby');
      const status = document.getElementById('lobby-status');
      const playersList = document.getElementById('players-list');

      let joinTimeout = null;
      joinBtn.addEventListener('click', () => {
        socket.emit('join_lobby');
        joinBtn.disabled = true;
        joinBtn.textContent = '匹配中...';
        // 如果在 8 秒内没有收到确认，恢复按钮并提示用户
        joinTimeout = setTimeout(() => {
          joinBtn.disabled = false;
          joinBtn.textContent = '加入匹配';
          showTempError('无法加入匹配，请稍后再试');
        }, 8000);
      });
      leaveBtn.addEventListener('click', () => {
        socket.emit('leave_lobby');
        leaveBtn.disabled = true;
      });

      socket.on('lobby_update', (data) => {
        playersList.innerHTML = '';
        (data.players || []).forEach(p => {
          const li = document.createElement('li');
          li.textContent = p;
          playersList.appendChild(li);
        });
        // 收到更新说明服务器响应正常，取消加入超时并恢复按钮以防卡住
        if (joinTimeout) {
          clearTimeout(joinTimeout);
          joinTimeout = null;
          joinBtn.disabled = false;
          joinBtn.textContent = '加入匹配';
        }
      });

      socket.on('lobby_joined', () => {
        status.textContent = '已加入匹配，等待对手';
        joinBtn.style.display = 'none';
        leaveBtn.style.display = 'inline-block';
        joinBtn.disabled = false;
        joinBtn.textContent = '加入匹配';
        if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
      });

      socket.on('lobby_left', () => {
        status.textContent = '未加入';
        joinBtn.style.display = 'inline-block';
        leaveBtn.style.display = 'none';
        leaveBtn.disabled = false;
        joinBtn.disabled = false;
        joinBtn.textContent = '加入匹配';
      });

      socket.on('match_found', (data) => {
        // data: { room_id }
        alert('找到对手，进入房间: ' + data.room_id);
        window.location.href = '/?room=' + data.room_id; // 跳回主页面并在前端使用 room id 加入
      });

      // 错误显示辅助
      function showTempError(text) {
        let err = document.getElementById('lobby-temp-error');
        if (!err) {
          err = document.createElement('div');
          err.id = 'lobby-temp-error';
          err.style.color = 'var(--danger, #e53935)';
          err.style.marginTop = '8px';
          document.getElementById('lobby-controls').appendChild(err);
        }
        err.textContent = text;
        setTimeout(() => {
          if (err && err.parentNode) err.parentNode.removeChild(err);
        }, 4000);
      }
    </script>
  </body>
</html>
